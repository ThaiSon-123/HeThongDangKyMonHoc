default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/
        args: [--line-length=100]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        files: ^backend/

  # dart format không có repo pre-commit chính thức → dùng hook local (cần `dart` trong PATH).
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: ^dang_ky_mon_hoc/.*\.dart$