<pre id="o" style="font-size:16px;white-space:pre-wrap"></pre>

  const o = document.getElementById('o');
  const log = (t) => (o.textContent += t + '\n');

    try {
      const d = await navigator.bluetooth.requestDevice({ filters: [{ services: [S] }] });
      const t0 = performance.now();
      const g = await d.gatt.connect();
      const v = await (await (await g.getPrimaryService(S)).getCharacteristic(C)).readValue();
