<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thông báo (app sinh viên)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#212121;background:var(--bg)}
a{text-decoration:none}
button,select,input,textarea{font-family:inherit}

/*ui-polish*/
:root{--primary:#3F51B5;--primary-dark:#2C3A7A;--navy:#1F2A5C;--accent:#D9480F;--bg:#F4F5FA;--surface:#FFFFFF;--success:#2E7D32;--danger:#C62828;--warning:#F9A825;--text:#212121;--muted:#6B7280;--radius:12px;--ease:cubic-bezier(.2,.7,.2,1)}
button,a,[role=tab],[role=switch],input,select,textarea{transition:filter .15s var(--ease),box-shadow .15s var(--ease),background-color .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
button:not(:disabled):hover{filter:brightness(.94)}
button:not(:disabled):active{transform:scale(.97)}
button:disabled{cursor:not-allowed}
nav a:hover{background:rgba(255,255,255,.1)}
.ui-trow:hover,.ui-click:hover{filter:brightness(.97)}
[role=option]:hover{background:#F1F3F9}
[role=option].ui-active{background:#E8EAF6!important}
:focus-visible{outline:3px solid #8C9BEA;outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(63,81,181,.18)}
[data-ui-invalid]{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(198,40,40,.15)!important}
.ui-tscroll{max-height:640px;overflow-y:auto}
.ui-thead{position:sticky;top:0;z-index:2}
.ui-skel{background:linear-gradient(90deg,#ECEFF5 0%,#F7F8FC 50%,#ECEFF5 100%);background-size:200% 100%;animation:ui-shimmer 1.3s linear infinite}
.ui-bc{display:flex;align-items:center;gap:6px;font-size:12px;color:#8A93B8;margin-bottom:6px}
.ui-bc a{color:#8A93B8}.ui-bc a:hover{color:var(--primary);text-decoration:underline}
@keyframes ui-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes ui-fade{from{opacity:0}to{opacity:1}}
@keyframes ui-slide{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes ui-pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@keyframes ui-toast{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes ui-page{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ui-sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes ui-shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ui-overlay{animation:ui-fade .18s var(--ease)}
aside[role=dialog]{animation:ui-slide .25s var(--ease)}
div[role=dialog]{animation:ui-pop .2s var(--ease)}
div[role=dialog] [role=alert]{animation:ui-shake .3s var(--ease)}
[role=listbox]{animation:ui-pop .15s var(--ease)}
.ui-toast{animation:ui-toast .25s var(--ease)}
main{animation:ui-page .3s var(--ease)}
.ui-approot{animation:ui-page .3s var(--ease)}
.ui-sheet{animation:ui-sheet .22s var(--ease)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/*end-ui-polish*/
</style>
<script>/*ui-polish-js*/
(function(){
  if (window.__uiPolish) return; window.__uiPolish = 1;
  function qs(s, r){ return (r || document).querySelector(s); }
  function qsa(s, r){ return [].slice.call((r || document).querySelectorAll(s)); }
  function norm(t){ return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }
  // ---- phím tắt: Esc đóng hộp thoại / ngăn chi tiết / danh sách; mũi tên + Enter trong ô gõ để tìm
  document.addEventListener('keydown', function(e){
    var ae = document.activeElement, lb = qs('[role=listbox]');
    if (e.key === 'Escape') {
      if (lb && ae && ae.tagName === 'INPUT') { ae.blur(); return; }
      var sheet = qs('.ui-sheet-ov'); if (sheet) { sheet.remove(); return; }
      var ds = qsa('[role=dialog]'); if (!ds.length) return;
      var btns = qsa('button', ds[ds.length - 1]);
      var c = btns.filter(function(b){ return b.getAttribute('aria-label') === 'Đóng'; })[0] || btns.filter(function(b){ return /^(Hủy|Đóng|Không hủy)/.test((b.textContent || '').trim()); })[0];
      if (c) { c.click(); e.preventDefault(); }
      return;
    }
    if (lb && ae && ae.tagName === 'INPUT' && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
      var opts = qsa('[role=option]', lb); if (!opts.length) return;
      var i = typeof lb.__ui === 'number' ? lb.__ui : -1;
      if (e.key === 'Enter') { if (i >= 0 && opts[i]) { opts[i].dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true })); e.preventDefault(); } return; }
      i = e.key === 'ArrowDown' ? Math.min(opts.length - 1, i + 1) : Math.max(0, i - 1);
      lb.__ui = i; opts.forEach(function(o, k){ o.classList.toggle('ui-active', k === i); });
      if (opts[i].scrollIntoView) opts[i].scrollIntoView({ block: 'nearest' });
      e.preventDefault();
    }
  }, true);
  document.addEventListener('input', function(){ var lb = qs('[role=listbox]'); if (lb) lb.__ui = -1; }, true);
  // ---- tự đặt con trỏ vào ô đầu tiên khi mở hộp thoại; đánh dấu ô liên quan tới thông báo lỗi
  function scan(){
    qsa('div[role=dialog]').forEach(function(d){
      if (!d.getAttribute('data-ui-seen')) {
        d.setAttribute('data-ui-seen', '1');
        var f = qs('input:not([type=checkbox]):not([disabled]),select:not([disabled]),textarea', d);
        if (f) setTimeout(function(){ try { f.focus(); } catch (x) {} }, 80);
      }
      var al = qs('[role=alert]', d), msg = al ? norm(al.textContent) : '';
      qsa('input:not([type=checkbox]),select,textarea', d).forEach(function(c){
        var t = '', l = c.closest('label');
        if (l) { t = l.firstChild && l.firstChild.nodeType === 3 ? l.firstChild.textContent : (qs('span', l) ? qs('span', l).textContent : ''); }
        else { var p = c.parentElement; for (var n = 0; n < 3 && p && !t; n++, p = p.parentElement) { var f = p.firstElementChild; if (f && f.tagName === 'SPAN' && f !== c) t = f.textContent; } }
        var k = norm(t).replace(/\(.*?\)/g, '').trim();
        if (msg && k.length >= 3 && msg.indexOf(k) >= 0) c.setAttribute('data-ui-invalid', '1'); else c.removeAttribute('data-ui-invalid');
      });
    });
  }
  try { new MutationObserver(function(){ scan(); }).observe(document.body, { childList: true, subtree: true, characterData: true }); } catch (x) {}
  // ---- bản App: danh sách chọn mở dạng bảng trượt từ dưới lên
  function setVal(sel, v){ var d = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value'); d.set.call(sel, v); sel.dispatchEvent(new Event('change', { bubbles: true })); }
  function openSheet(sel){
    var ov = document.createElement('div'); ov.className = 'ui-sheet-ov';
    ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:rgba(17,24,39,.45);display:flex;align-items:flex-end;animation:ui-fade .18s';
    ov.addEventListener('click', function(ev){ if (ev.target === ov) ov.remove(); });
    var sh = document.createElement('div'); sh.className = 'ui-sheet'; sh.setAttribute('role', 'listbox');
    sh.style.cssText = 'width:100%;max-height:72%;overflow:auto;background:#FFFFFF;border-radius:20px 20px 0 0;padding:10px 0 24px;box-shadow:0 -8px 30px rgba(17,24,39,.25);font-family:inherit';
    var grip = document.createElement('div'); grip.style.cssText = 'width:40px;height:4px;border-radius:999px;background:#D5D9E4;margin:0 auto 10px'; sh.appendChild(grip);
    var lab = sel.closest('label'); var t = sel.getAttribute('aria-label') || (lab && lab.firstChild && lab.firstChild.nodeType === 3 ? lab.firstChild.textContent.trim() : '') || 'Chọn';
    var h = document.createElement('div'); h.textContent = t; h.style.cssText = 'padding:4px 20px 10px;font-size:15px;font-weight:700;color:#1F2A5C'; sh.appendChild(h);
    [].forEach.call(sel.options, function(o){
      var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'option'); b.textContent = o.text;
      var on = o.value === sel.value;
      b.style.cssText = 'display:block;width:100%;text-align:left;min-height:52px;padding:0 20px;border:0;background:' + (on ? '#E8EAF6' : 'transparent') + ';color:' + (on ? '#2C3A7A' : '#212121') + ';font-size:16px;font-weight:' + (on ? '600' : '400') + ';cursor:pointer;font-family:inherit';
      b.addEventListener('click', function(){ setVal(sel, o.value); ov.remove(); });
      sh.appendChild(b);
    });
    ov.appendChild(sh); document.body.appendChild(ov);
  }
  document.addEventListener('mousedown', function(e){
    var t = e.target; if (!t || t.tagName !== 'SELECT' || t.disabled) return;
    if (!qs('.ui-approot') && document.documentElement.clientWidth > 520) return;
    e.preventDefault(); openSheet(t);
  }, true);
})();
/*end-ui-polish-js*/</script>
</helmet>
<div class="ui-approot" style="position:relative;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);overflow:hidden">
  <header style="flex:0 0 auto;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--navy) 0%,var(--primary-dark) 100%);color:#FFFFFF;border-radius:0 0 24px 24px;padding:14px 16px 18px 4px;display:flex;align-items:center;gap:4px"><span aria-hidden="true" style="position:absolute;right:-50px;top:-70px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07)"></span><a href="SV-App-TongQuan.dc.html" aria-label="Quay lại" style="position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex:0 0 auto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="position:relative;display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Thông báo</span><span style="font-size:12px;opacity:.88">Từ nhà trường, giáo viên và hệ thống</span></div></header>

  <div style="flex:1 1 auto;overflow:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div role="group" aria-label="Lọc" style="display:flex;gap:8px"><sc-for list="{{filters}}" as="f" hint-placeholder-count="2"><button aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button></sc-for></div>
      <button onClick="{{readAll}}" style="min-height:48px;padding:0 6px;border:0;background:transparent;color:var(--primary);font-weight:600;font-size:13px">Đọc tất cả</button>
    </div>
    <sc-for list="{{items}}" as="n" hint-placeholder-count="4">
      <button onClick="{{n.open}}" aria-expanded="{{n.expanded}}" style="text-align:left;width:100%;box-sizing:border-box;border:0;border-radius:16px;box-shadow:0 2px 10px rgba(31,42,92,.08);background:{{n.bg}};padding:14px;display:flex;gap:12px;align-items:flex-start;color:#212121">
        <span style="{{n.dot}}"></span>
        <span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1"><span style="{{n.titleStyle}}">{{n.title}}</span><span style="font-size:12px;color:#6B7280">{{n.from}} · {{n.time}}</span><sc-if value="{{n.expanded}}" hint-placeholder-val="{{false}}"><span style="font-size:14px;color:#374151;line-height:1.55;margin-top:6px">{{n.body}}</span></sc-if></span>
      </button>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="padding:40px 16px;text-align:center;color:#6B7280;font-size:14px">Không có thông báo chưa đọc.</div></sc-if>
  </div>

  
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', openId: '', read: { n3: true, n4: true, n5: true } };
  }
  renderVals() {

    const S = this.state;
    const INBOX = [
      { id: 'n1', title: 'Lớp CNTT203-02 đổi phòng học', from: 'Phòng đào tạo', time: '09/10 · 09:05', body: 'Từ 14/10/2026, lớp Cơ sở dữ liệu chuyển từ P.B203 sang P.B305 cho các buổi Thứ 4 và Thứ 7. Tiết học không đổi.' },
      { id: 'n2', title: 'Điểm học phần Hệ điều hành đã được công bố', from: 'Phòng đào tạo', time: '07/10 · 16:40', body: 'Điểm chính thức môn Hệ điều hành đã được duyệt. Xem chi tiết tại mục Điểm.' },
      { id: 'n3', title: 'Học phí học kỳ 1 sắp đến hạn', from: 'Phòng kế toán', time: '05/10 · 08:00', body: 'Học phí còn nợ 4.320.000 ₫, hạn đóng 31/10/2026. Vui lòng nộp tại phòng Kế toán.' },
      { id: 'n4', title: 'Đăng ký môn học thành công', from: 'Hệ thống', time: '12/08 · 08:31', body: 'Bạn đã đăng ký thành công lớp CNTT101-01 – Lập trình hướng đối tượng.' },
      { id: 'n5', title: 'Lịch thi giữa kỳ đã được công bố', from: 'Phòng đào tạo', time: '28/09 · 14:00', body: 'Lịch thi giữa kỳ học kỳ 1 đã được đăng tải. Liên hệ Phòng đào tạo nếu có trùng lịch.' }
    ];
    const fb = 'min-height:48px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;';
    const filters = [['all', 'Tất cả'], ['unread', 'Chưa đọc']].map(([id, label]) => ({ label, on: S.filter === id, pick: () => this.setState({ filter: id }), style: fb + (S.filter === id ? 'background:var(--primary);color:#FFFFFF;border:1px solid var(--primary)' : 'background:#FFFFFF;color:#374151;border:1px solid #C4C9D4') }));
    const list = INBOX.filter((n) => S.filter === 'all' || !S.read[n.id]);
    const items = list.map((n) => { const un = !S.read[n.id]; return { ...n, expanded: S.openId === n.id, bg: un ? '#F7F8FF' : '#FFFFFF',
      dot: 'flex:0 0 auto;margin-top:5px;width:10px;height:10px;border-radius:50%;background:' + (un ? '#3F51B5' : 'transparent') + ';border:' + (un ? '0' : '1px solid #C4C9D4'),
      titleStyle: 'font-size:15px;line-height:1.35;font-weight:' + (un ? '700' : '500'),
      open: () => this.setState({ openId: S.openId === n.id ? '' : n.id, read: { ...S.read, [n.id]: true } }) }; });

    return {

      filters, items, empty: list.length === 0, readAll: () => this.setState({ read: { n1: true, n2: true, n3: true, n4: true, n5: true } })
    };
  }
}
</script>
</body>
