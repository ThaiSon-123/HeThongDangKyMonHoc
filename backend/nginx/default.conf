# API qua Gunicorn; static/media do web container collectstatic ra volume `staticfiles`.
upstream django {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
